; Clean, minimal LoRa test for the Seeed Wio-SX1262 + XIAO ESP32S3 kit.
; One project, two roles. Flash one board as SENDER and one as RECEIVER
; by changing NODE_ROLE below (or override per-env on the CLI).

; Matched to the Main/Audio node config so all three XIAO ESP32-S3 boards share the
; same platform + USB identity. monitor_rts/dtr=0 stops the monitor from resetting
; (re-enumerating) the board on connect.
[env]
platform = espressif32@7.0.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = default, time, esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0
board_build.esp32_psram = enabled
board_build.psram_type = opi
lib_deps =
    jgromes/RadioLib @ ^7.1.0
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

; ---- Flash THIS env to the transmitting board ----
; Give each physical transmitting device its own unique NODE_ID.
; The sender also brings up WiFi + ElegantOTA (push updates at http://<ip>/update).
; Credentials are hard-coded for now; a later step will fetch them from the main
; node over UART, mirroring how the AudioNode receives its config.
[env:sender]
build_flags = -D NODE_ROLE=0 -D NODE_ID=1
lib_deps =
    ${env.lib_deps}
    ayushsharma82/ElegantOTA @ ^3.1.0

; ---- Flash THIS env to the receiving board ----
[env:receiver]
build_flags = -D NODE_ROLE=1
